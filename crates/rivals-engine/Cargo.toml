[package]
name = "rivals-engine"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Marvel Rivals scorer and beam composer; built with wasm-pack into src/web/wasm"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
